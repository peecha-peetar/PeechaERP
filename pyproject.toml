[project]
name = "peecha"
version = "0.1.0"
description = "پیچا — نرم‌افزار حسابداری/ERP چندشرکتی، چندارزی، چندزبانه"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",           # رابطِ کاربریِ اصلی (Qt6)
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "alembic>=1.13",
    "jdatetime>=5.0",         # تقویم شمسی (پیش‌فرض طبق docs/ui-ux-guidelines.md بخش ۱)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
